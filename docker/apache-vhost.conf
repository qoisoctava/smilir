# smilir container vhost.
#
# DocumentRoot is public/; the private app/ (config.php, DAG loader) stays one
# level above and is therefore unreachable over HTTP. AllowOverride keeps the
# shipped .htaccess working, so the container behaves exactly like cPanel.
<VirtualHost *:80>
    ServerName localhost
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/pipnix/public

    ServerSignature Off

    <Directory /var/www/pipnix/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Repeat the .htaccess guard in case AllowOverride is ever disabled.
    <Files "lib.php">
        Require all denied
    </Files>

    ErrorLog  /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
