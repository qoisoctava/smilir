; smilir container defaults (mounted as a conf.d drop-in).
expose_php = Off
display_errors = Off
log_errors = On
memory_limit = 256M
upload_max_filesize = 16M
post_max_size = 18M
max_execution_time = 120

; bootstrap.php applies config['timezone'] at runtime; this is only the
; pre-bootstrap default.
date.timezone = UTC
